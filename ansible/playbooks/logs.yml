---
# Read logs without SSH-ing into the machine (journald is the log store for
# every unit):
#   ansible-playbook playbooks/logs.yml -e service=identity
#   ansible-playbook playbooks/logs.yml -e service=caddy -e lines=500
# Without service= every apps-* unit is shown.
- name: logs
  hosts: server
  gather_facts: false
  tasks:
    - name: read logs
      ansible.builtin.command:
        cmd: >-
          journalctl -u {{ ('apps-' + service) if service is defined else 'apps-*' }}
          -n {{ lines | default(200) }} --no-pager
      changed_when: false
      register: logs

    - name: print
      ansible.builtin.debug:
        msg: "{{ logs.stdout_lines }}"
