---
# Quick overview without touching the machine: units, containers, disk,
# timers, last backup.
- name: status
  hosts: server
  gather_facts: false
  tasks:
    - name: units
      ansible.builtin.command: systemctl list-units apps-* --no-pager
      changed_when: false
      register: units

    - name: containers
      ansible.builtin.command: podman ps -a
      changed_when: false
      register: containers

    - name: disk
      ansible.builtin.command: df -h /
      changed_when: false
      register: disk

    - name: podman disk usage
      ansible.builtin.command: podman system df
      changed_when: false
      register: podman_disk

    - name: timers
      ansible.builtin.command: systemctl list-timers apps-* --no-pager
      changed_when: false
      register: timers

    - name: last backup
      ansible.builtin.command: ls -lhtr {{ backup_dir }}
      changed_when: false
      failed_when: false
      register: backups

    - name: report
      ansible.builtin.debug:
        msg:
          - "{{ units.stdout_lines }}"
          - "{{ containers.stdout_lines }}"
          - "{{ disk.stdout_lines }}"
          - "{{ podman_disk.stdout_lines }}"
          - "{{ timers.stdout_lines }}"
          - "{{ backups.stdout_lines | default(['no backups yet']) }}"
