---
- name: base packages
  ansible.builtin.apt:
    name:
      - age
      - ca-certificates
      - curl
      - gnupg
      - jq
      - rsync
      - unattended-upgrades
      - wireguard
    update_cache: true
    cache_valid_time: 3600

- name: docker apt keyring
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker

- name: docker packages
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin

- name: docker daemon json (log rotation for every container)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  notify: restart docker

- name: journald size limit
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-limits.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=200M
  notify: restart journald

- name: automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: deploy user
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker,sudo
    append: true

- name: textfile collector directory for node exporter
  ansible.builtin.file:
    path: "{{ textfile_dir }}"
    state: directory
    mode: "0755"

- name: wireguard configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: restart wireguard

- name: wireguard up
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started

# No host firewall on purpose. The router forwards are the outer boundary
# (80/443 and the wireguard port), and docker published ports bypass ufw
# anyway -- what containers publish and the address they bind decides
# exposure. See documentation/operations.md.

- name: sshd listens on wireguard only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/60-wireguard.conf
    mode: "0644"
    content: |
      ListenAddress {{ wireguard_address.split('/')[0] }}
      PasswordAuthentication no
  when: restrict_ssh | bool
  notify: restart sshd
