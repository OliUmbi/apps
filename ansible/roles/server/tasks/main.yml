---
- name: base packages
  ansible.builtin.apt:
    name:
      - age
      - ca-certificates
      - curl
      # node-exporter's systemd collector needs the system bus socket; a
      # minimal Debian 13 install does not provide it (found on the first
      # real-host bootstrap, 2026-11).
      - dbus
      - gnupg
      - jq
      - rsync
      - sudo
      - unattended-upgrades
      - wireguard
    update_cache: true
    cache_valid_time: 3600

# podman ships the quadlet generator (podman-system-generator): every
# workload is a systemd unit, there is no container daemon on this box.
# Debian stable must carry podman >= 5.x -- see documentation/history/deployment-plan.md.
- name: podman package
  ansible.builtin.apt:
    name:
      - podman

# A minimal Debian install does not necessarily ship the journald drop-in
# directory; create it before writing the limit (found on the first real-host
# bootstrap, 2026-11).
- name: journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: journald size limit (journald is the log store for every unit)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-limits.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=200M
  notify: restart journald

- name: automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: deploy user
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: sudo
    append: true

- name: textfile collector directory for node exporter
  ansible.builtin.file:
    path: "{{ textfile_dir }}"
    state: directory
    mode: "0755"

- name: wireguard configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  # The template renders the server private key.
  no_log: true
  notify: restart wireguard

- name: wireguard up
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started

# No host firewall on purpose. The router forwards are the outer boundary
# (80/443 and the wireguard port), and published ports bypass ufw anyway --
# what the units publish and where they bind decides exposure. See
# documentation/operations/access-and-security.md.

# Password authentication is disabled from the first boot and stays disabled
# when restrict_ssh is flipped back. Key access is the only method; the setup
# runbook adds the deploy key before the first run.
- name: sshd disables password authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-no-passwords.conf
    mode: "0644"
    content: |
      PasswordAuthentication no
  notify: restart ssh

- name: sshd listens on wireguard only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/60-wireguard.conf
    mode: "0644"
    content: |
      ListenAddress {{ wireguard_address.split('/')[0] }}
  when: restrict_ssh | bool
  notify: restart ssh

# Keeping the drop-in when restrict_ssh flips back to false would leave SSH
# bound to the tunnel forever. Removing it makes the restriction reversible
# (DR-19).
- name: sshd listens on all interfaces again
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/60-wireguard.conf
    state: absent
  when: not (restrict_ssh | bool)
  notify: restart ssh
