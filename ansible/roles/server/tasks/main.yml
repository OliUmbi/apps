---
- name: base packages
  ansible.builtin.apt:
    name:
      - age
      - ca-certificates
      - curl
      - gnupg
      - jq
      - rsync
      - unattended-upgrades
      - wireguard
    update_cache: true
    cache_valid_time: 3600

# podman ships the quadlet generator (podman-system-generator): every
# workload is a systemd unit, there is no container daemon on this box.
# Debian stable must carry podman >= 5.x -- see documentation/deployment-plan.md.
- name: podman package
  ansible.builtin.apt:
    name:
      - podman

- name: journald size limit (journald is the log store for every unit)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-limits.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=200M
  notify: restart journald

- name: automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: deploy user
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: sudo
    append: true

- name: textfile collector directory for node exporter
  ansible.builtin.file:
    path: "{{ textfile_dir }}"
    state: directory
    mode: "0755"

- name: wireguard configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: restart wireguard

- name: wireguard up
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started

# No host firewall on purpose. The router forwards are the outer boundary
# (80/443 and the wireguard port), and published ports bypass ufw anyway --
# what the units publish and where they bind decides exposure. See
# documentation/operations.md.

- name: sshd listens on wireguard only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/60-wireguard.conf
    mode: "0644"
    content: |
      ListenAddress {{ wireguard_address.split('/')[0] }}
      PasswordAuthentication no
  when: restrict_ssh | bool
  notify: restart sshd
