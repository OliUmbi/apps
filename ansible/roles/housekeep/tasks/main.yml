---
- name: housekeep script
  ansible.builtin.copy:
    src: "{{ repo_root }}/ansible/files/housekeep.sh"
    dest: /usr/local/sbin/apps-housekeep.sh
    mode: "0750"

- name: housekeep units
  ansible.builtin.copy:
    src: "{{ repo_root }}/ansible/files/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - apps-housekeep.service
    - apps-housekeep.timer

- name: housekeep timer
  ansible.builtin.systemd:
    name: apps-housekeep.timer
    enabled: true
    state: started
    daemon_reload: true
