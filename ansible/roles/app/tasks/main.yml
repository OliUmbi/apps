---
- name: project directory
  ansible.builtin.file:
    path: "{{ project_dir }}"
    state: directory
    mode: "0750"

- name: compose files
  ansible.builtin.copy:
    src: "{{ repo_root }}/infrastructure/{{ item }}"
    dest: "{{ project_dir }}/{{ item }}"
    mode: "0640"
  loop:
    - compose.prod.yaml
    - compose.monitoring.yaml

- name: monitoring configuration
  ansible.builtin.copy:
    src: "{{ repo_root }}/infrastructure/monitoring/"
    dest: "{{ project_dir }}/monitoring/"
    mode: "0640"

- name: alertmanager receiver url
  ansible.builtin.replace:
    path: "{{ project_dir }}/monitoring/alertmanager.yml"
    regexp: __NTFY_WEBHOOK_URL__
    replace: "{{ vault_ntfy_webhook_url }}"

- name: environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ project_dir }}/.env"
    mode: "0600"

- name: pull images
  ansible.builtin.command:
    cmd: docker compose --env-file .env -f {{ item }} pull
    chdir: "{{ project_dir }}"
  loop:
    - compose.prod.yaml
    - compose.monitoring.yaml
  changed_when: true

- name: app stack
  ansible.builtin.command:
    cmd: docker compose --env-file .env -f compose.prod.yaml up -d --remove-orphans
    chdir: "{{ project_dir }}"
  changed_when: true

- name: monitoring stack
  ansible.builtin.command:
    cmd: docker compose --env-file .env -f compose.monitoring.yaml up -d --remove-orphans
    chdir: "{{ project_dir }}"
  changed_when: true
