server:
  port: 8082
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 100
  datasource:
    url: jdbc:${DATABASE_URL}
    username: ${MESSAGING_DATABASE_USER}
    password: ${MESSAGING_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MESSAGING_SMTP_HOST}
    port: ${MESSAGING_SMTP_PORT}
    username: ${MESSAGING_SMTP_USERNAME:}
    password: ${MESSAGING_SMTP_PASSWORD:}
    properties:
      "mail.smtp.auth": ${MESSAGING_SMTP_AUTH:false}
      "mail.smtp.starttls.enable": ${MESSAGING_SMTP_TLS:false}
      "mail.smtp.starttls.required": ${MESSAGING_SMTP_TLS_REQUIRED:false}
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 5000
      "mail.smtp.writetimeout": 5000
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
# /docs stays closed outside the dev profile (RS-D4); health stays open for compose checks.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    path: /docs
    enabled: false
messaging:
  authorization-token: ${MESSAGING_INTERNAL_AUTHORIZATION_TOKEN}
  worker:
    # Worst case is batch-size x (connect + read + write timeout) = 10 x 15s =
    # 150s, well below the lease. Raising either number without rechecking that
    # arithmetic can turn a slow send into a duplicate email.
    batch-size: 10
    accept-poll-delay-ms: 1000
    deliver-poll-delay-ms: 1000
    lease-duration: 10m
    retry-delays: [2m, 4m, 8m, 16m]

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
