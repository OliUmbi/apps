name: publish

on:
  push:
    tags:
      - '*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Hard gate: the shared ci.yml (push/PR verification) must be green on this
  # commit before any image is built or pushed.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: apps-identity
            context: .
            dockerfile: ./services/identity/Dockerfile
          - image: apps-messaging
            context: .
            dockerfile: ./services/messaging/Dockerfile
          - image: apps-assets
            context: .
            dockerfile: ./services/assets/Dockerfile
          - image: apps-studio
            context: .
            dockerfile: ./web/sites/studio/Dockerfile
          - image: apps-jublawoma
            context: .
            dockerfile: ./web/sites/jublawoma/Dockerfile
          - image: apps-unclet
            context: .
            dockerfile: ./web/sites/unclet/Dockerfile
          - image: apps-zelglihof
            context: .
            dockerfile: ./web/sites/zelglihof/Dockerfile
          - image: apps-oliumbi
            context: .
            dockerfile: ./web/sites/oliumbi/Dockerfile
          - image: apps-migrate
            context: .
            dockerfile: ./database/Dockerfile
          - image: apps-caddy
            context: .
            dockerfile: ./infrastructure/caddy/Dockerfile

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: docker login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/oliumbi/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
