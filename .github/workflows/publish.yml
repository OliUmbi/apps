name: publish

on:
  push:
    tags:
      - '*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Hard gate: the shared ci.yml (push/PR verification) must be green on this
  # commit before any image is built or pushed.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: apps-identity
            context: .
            dockerfile: ./services/identity/Dockerfile
          - image: apps-messaging
            context: .
            dockerfile: ./services/messaging/Dockerfile
          - image: apps-assets
            context: .
            dockerfile: ./services/assets/Dockerfile
          - image: apps-studio
            context: .
            dockerfile: ./web/sites/studio/Dockerfile
          - image: apps-jublawoma
            context: .
            dockerfile: ./web/sites/jublawoma/Dockerfile
          - image: apps-unclet
            context: .
            dockerfile: ./web/sites/unclet/Dockerfile
          - image: apps-zelglihof
            context: .
            dockerfile: ./web/sites/zelglihof/Dockerfile
          - image: apps-oliumbi
            context: .
            dockerfile: ./web/sites/oliumbi/Dockerfile
          - image: apps-migrate
            context: .
            dockerfile: ./database/Dockerfile
          - image: apps-caddy
            context: .
            dockerfile: ./infrastructure/caddy/Dockerfile

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: set up buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.7.0
        with:
          images: ghcr.io/oliumbi/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
