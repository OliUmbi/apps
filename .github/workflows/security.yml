name: security

# Blocking weekly supply-chain run. Pull requests get the report-only variant in
# ci.yml so a new upstream CVE never blocks an unrelated hotfix; here a finding
# is a task for the week.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: secrets, dependencies and lockfile audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: secret scan
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          detect --source=/repo --no-git --redact --verbose

      - name: dependency scan
        run: >
          docker run --rm -v "$PWD:/repo"
          aquasec/trivy:0.67.0@sha256:94711c60051c6cab848a292e3a67f62623fcee361b2bb661f43b17184f4afdac
          fs --scanners vuln --severity HIGH,CRITICAL --no-progress --exit-code 1
          --skip-dirs /repo/legacy --skip-dirs /repo/web/node_modules
          --skip-dirs /repo/.pnpm-store /repo

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm audit
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high
