name: security

# Blocking weekly supply-chain run. Pull requests get the report-only variant in
# ci.yml so a new upstream CVE never blocks an unrelated hotfix; here a finding
# is a task for the week.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: secrets, dependencies and lockfile audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: secret scan
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --no-git --redact --verbose

      # trivy.yaml mirrors Maven Central: resolving the poms makes many
      # requests and anonymous clients get HTTP 429 from Central.
      - name: dependency scan
        run: >
          docker run --rm -v "$PWD:/repo"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          fs -c /repo/trivy.yaml --scanners vuln --severity HIGH,CRITICAL --no-progress --exit-code 1
          --skip-dirs /repo/legacy --skip-dirs /repo/web/node_modules
          --skip-dirs /repo/.pnpm-store /repo

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm audit
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high
