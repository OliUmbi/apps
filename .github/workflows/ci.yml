name: ci

# Runs the verification commands from documentation/development/verification.md:
# web `pnpm check` / `pnpm typecheck` / `pnpm test` / `pnpm build`, Java
# `services/mvnw -f services/pom.xml test`, and a no-push build of every image
# with the same matrix as publish.yml (so Dockerfile/base-image breakage
# surfaces on pull requests, DR-13).
#
# The toolchain majors stay as documented in the root README (Node 26, pnpm 12
# via web/package.json, JDK 25, Maven 3.10.0 via the services wrapper). The
# deployment job checks what the server actually runs -- the quadlet units must
# generate and the ansible playbooks must parse; the dev compose rig is a
# workstation tool and CI does not depend on it. publish.yml calls this workflow
# and only builds and pushes images when it is green, so tag pushes skip the
# standalone trigger below and are verified through that call instead.
#
# Inputs are pinned: actions use commit SHAs, CI tool images use tag@digest,
# and ansible-core is an exact version (DR-14). Bump the tag and digest together.

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: web (check, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: web
    env:
      # The PostgreSQL-gated suites under tests/integration/ skip when this is
      # unset. CI points it at the migrated test database so the suites run on
      # every change, and the guard step below fails the job if anything skips
      # anyway (the harness itself also throws when CI is set without a URL).
      STUDIO_TEST_ADMIN_URL: postgres://postgres:ci-postgres@127.0.0.1:5432/apps
    services:
      postgres:
        # postgres:18-alpine@sha256:... -- bump tag and digest together (DR-14).
        image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_DB: apps
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      # Apply database/migrations/ in order to the test database -- the same
      # Flyway major that production's apps-migrate image runs. The image is
      # pinned by tag@digest (DR-14).
      - name: migrate the test database
        run: >
          docker run --rm --network host
          -v "$GITHUB_WORKSPACE/database/migrations:/flyway/sql:ro"
          flyway/flyway:13.12.2-alpine@sha256:f5b9740a05ef38fc31356dcf2e7796dafc693ea289546e82c7699d37f83349af
          -url=jdbc:postgresql://127.0.0.1:5432/apps
          -user=postgres
          -password=ci-postgres
          -connectRetries=60
          -locations=filesystem:/flyway/sql
          migrate

      - name: pnpm check
        run: pnpm check

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm test
        run: pnpm test | tee test-output.txt

      - name: no suite may skip silently
        run: |
          if grep -Eq '^(# |ℹ )?skipped [1-9]' test-output.txt; then
            echo "::error::a test suite was skipped - the PostgreSQL-gated suites run against the postgres service and must not skip"
            exit 1
          fi

      - name: pnpm build
        run: pnpm build

      # The build regenerates the committed route trees; a stale tree would
      # otherwise pass typecheck against the old file and build against the new.
      - name: route trees are committed
        run: |
          if ! git diff --quiet -- 'sites/*/src/routeTree.gen.ts'; then
            git --no-pager diff --stat -- 'sites/*/src/routeTree.gen.ts'
            echo "::error::routeTree.gen.ts is stale - run pnpm build and commit the regenerated tree"
            exit 1
          fi

  java:
    name: services (mvnw test)
    runs-on: ubuntu-latest
    env:
      # The narrow persistence suites validate JPA mappings and native SQL
      # against the migrated schema; without this they are disabled and CI
      # would lose its only schema-drift check.
      STUDIO_TEST_ADMIN_URL: postgres://postgres:ci-postgres@127.0.0.1:5432/apps
    services:
      postgres:
        # postgres:18-alpine@sha256:... -- bump tag and digest together (DR-14).
        image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_DB: apps
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Apply database/migrations/ in order to the test database before the
      # persistence suites boot. Same Flyway image as the web job.
      - name: migrate the test database
        run: >
          docker run --rm --network host
          -v "$GITHUB_WORKSPACE/database/migrations:/flyway/sql:ro"
          flyway/flyway:13.12.2-alpine@sha256:f5b9740a05ef38fc31356dcf2e7796dafc693ea289546e82c7699d37f83349af
          -url=jdbc:postgresql://127.0.0.1:5432/apps
          -user=postgres
          -password=ci-postgres
          -connectRetries=60
          -locations=filesystem:/flyway/sql
          migrate

      # The wrapper (services/.mvn/wrapper/maven-wrapper.properties) pins the
      # same Maven version the READMEs document, so CI and local runs agree.
      - name: services/mvnw -f services/pom.xml test
        run: services/mvnw -B -ntp -f services/pom.xml test

      # Persistence suites self-disable when the URL is missing. Check the three
      # suite reports rather than a module-wide skipped count, because the
      # assets module legitimately skips its Windows-only junction test on Linux.
      - name: persistence suites must run
        run: |
          set -eu
          for report in \
            services/identity/target/surefire-reports/ch.oliumbi.identity.repositories.IdentityPersistenceTest.txt \
            services/messaging/target/surefire-reports/ch.oliumbi.messaging.repositories.MessagingPersistenceTest.txt \
            services/assets/target/surefire-reports/ch.oliumbi.assets.repositories.AssetsPersistenceTest.txt; do
            test -f "$report" || { echo "::error::$report missing - the suite did not run"; exit 1; }
            grep -Eq 'Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0, ' "$report" \
              || { echo "::error::$report: $(tail -n 1 "$report")"; exit 1; }
          done
          if grep -Rqs 'Environment variable \[STUDIO_TEST_ADMIN_URL\] does not exist' services/*/target/surefire-reports; then
            echo "::error::a persistence suite disabled itself - STUDIO_TEST_ADMIN_URL is missing"
            exit 1
          fi

  # Build only, never push: this is the PR-time guard for Dockerfile, base-image
  # and Caddy-plugin breakage (DR-13). Same matrix as publish.yml, including the
  # static Oliumbi placeholder. gha cache keeps the repeat cost low.
  images:
    name: images (build, no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: apps-identity
            context: .
            dockerfile: ./services/identity/Dockerfile
          - image: apps-messaging
            context: .
            dockerfile: ./services/messaging/Dockerfile
          - image: apps-assets
            context: .
            dockerfile: ./services/assets/Dockerfile
          - image: apps-studio
            context: .
            dockerfile: ./web/sites/studio/Dockerfile
          - image: apps-jublawoma
            context: .
            dockerfile: ./web/sites/jublawoma/Dockerfile
          - image: apps-unclet
            context: .
            dockerfile: ./web/sites/unclet/Dockerfile
          - image: apps-zelglihof
            context: .
            dockerfile: ./web/sites/zelglihof/Dockerfile
          - image: apps-oliumbi
            context: .
            dockerfile: ./web/sites/oliumbi/Dockerfile
          - image: apps-migrate
            context: .
            dockerfile: ./database/Dockerfile
          - image: apps-caddy
            context: .
            dockerfile: ./infrastructure/caddy/Dockerfile

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ghcr.io/oliumbi/${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployment:
    name: deployment (units + ansible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The quadlet generator is the parser that consumes the units on the
      # server: it errors on malformed files and missing required keys, and
      # every unit file must yield a .service. (Unknown keys are silently
      # dropped by podman, so key typos surface at server verification, not
      # here.) The jinja placeholders are rendered first, the same way the
      # ansible app role does; the generator runs in the podman image so CI
      # uses the podman 5.x generation the server requires. The image is
      # pinned by tag@digest (DR-14).
      - name: units generate (quadlet)
        run: |
          docker run --rm -v "$PWD/infrastructure/units:/units:ro" quay.io/podman/stable:v5.8.9@sha256:f7a17ef911a2b9b866ada8a9426a07e29a6e4f8109ef8c0e0b7010c2541b4e49 sh -c '
            set -eu
            mkdir -p /out
            cp -r /units /tmp/units
            sed -i "s/{{ image_tag }}/ci/g" /tmp/units/*
            sed -i "s/{{ monitoring_bind }}/127.0.0.1/g" /tmp/units/*
            QUADLET_UNIT_DIRS=/tmp/units /usr/lib/systemd/system-generators/podman-system-generator /out /out /out
            expected=$(find /tmp/units -maxdepth 1 -type f \( -name "*.container" -o -name "*.network" -o -name "*.volume" \) | wc -l)
            generated=$(ls /out | grep -c "\.service$")
            echo "generated $generated of $expected unit files"
            test "$generated" -eq "$expected"
          '

      - name: ansible playbooks syntax
        run: |
          docker run --rm -v "$PWD/ansible:/ansible:ro" -w /ansible python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e sh -c '
            set -eu
            export ANSIBLE_ROLES_PATH=/ansible/roles
            export ANSIBLE_INVENTORY=/ansible/inventory.yml
            pip install -q "ansible-core==2.22.0"
            for p in playbooks/*.yml; do
              ansible-playbook --syntax-check "$p"
            done
          '

      # The image build validates the Caddyfile with the custom modules; these
      # steps validate the monitoring files before they reach the host.
      - name: prometheus configuration
        run: |
          docker run --rm -v "$PWD/infrastructure/monitoring:/etc/prometheus:ro" --entrypoint /bin/promtool \
            prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infrastructure/monitoring:/etc/prometheus:ro" --entrypoint /bin/promtool \
            prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06 \
            check rules /etc/prometheus/alerts.yml

      - name: alertmanager configuration
        run: |
          sed 's|__NTFY_WEBHOOK_URL__|https://example.invalid/topic|' \
            infrastructure/monitoring/alertmanager.yml > "$RUNNER_TEMP/alertmanager.yml"
          docker run --rm -v "$RUNNER_TEMP/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" --entrypoint /bin/amtool \
            prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c \
            check-config /etc/alertmanager/alertmanager.yml

      - name: blackbox configuration
        run: |
          docker run --rm -v "$PWD/infrastructure/monitoring/blackbox.yml:/etc/blackbox.yml:ro" --entrypoint /bin/blackbox_exporter \
            prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13 \
            --config.file=/etc/blackbox.yml --config.check

  # Supply-chain guard. A committed secret fails the run immediately; dependency
  # findings are reported (not blocking) here and become blocking in the weekly
  # security workflow, so a hotfix is never held hostage by an upstream CVE.
  security:
    name: security (secrets + dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: secret scan
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --no-git --redact --verbose

      # trivy.yaml mirrors Maven Central: resolving the poms makes many
      # requests and anonymous clients get HTTP 429 from Central.
      - name: dependency scan (report only)
        run: >
          docker run --rm -v "$PWD:/repo"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          fs -c /repo/trivy.yaml --scanners vuln --severity HIGH,CRITICAL --no-progress
          --skip-dirs /repo/legacy --skip-dirs /repo/web/node_modules
          --skip-dirs /repo/.pnpm-store /repo
