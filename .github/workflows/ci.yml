name: ci

# Runs the verification commands from documentation/development/verification.md:
# web `pnpm check` / `pnpm typecheck` / `pnpm test` / `pnpm build` and Java
# `services/mvnw -f services/pom.xml test`, on the toolchain majors documented in
# the root README (Node 24, pnpm 11 via the web/package.json packageManager pin,
# JDK 25, Maven 3.9.12 via the services/.mvn wrapper pin). `pnpm typecheck`
# runs `pnpm generate` first (single owner of the Paraglide message output), so
# a clean checkout type-checks without a build. The deployment job checks what
# the server actually runs -- the quadlet units must generate and the ansible
# playbooks must parse; the dev compose rig is a workstation tool and CI does
# not depend on it. publish.yml calls this workflow and only builds and pushes
# images when it is green, so tag pushes skip the standalone trigger below and
# are verified through that call instead.

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: web (check, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: web
    env:
      # tests/studio-repositories.test.ts and tests/db-invariants.test.ts are
      # PostgreSQL-gated and skip silently when this is unset. CI points it at
      # the migrated test database so the suites run on every change, and the
      # guard step below fails the job if anything skips anyway.
      STUDIO_TEST_ADMIN_URL: postgres://postgres:ci-postgres@127.0.0.1:5432/apps
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: apps
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      # Apply database/migrations/ in order to the test database -- the same
      # Flyway major that production's apps-migrate image runs.
      - name: migrate the test database
        run: >
          docker run --rm --network host
          -v "$GITHUB_WORKSPACE/database/migrations:/flyway/sql:ro"
          flyway/flyway:13.4.0-alpine
          -url=jdbc:postgresql://127.0.0.1:5432/apps
          -user=postgres
          -password=ci-postgres
          -connectRetries=60
          -locations=filesystem:/flyway/sql
          migrate

      - name: pnpm check
        run: pnpm check

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm test
        run: pnpm test | tee test-output.txt

      - name: no suite may skip silently
        run: |
          if grep -Eq '^(# |ℹ )?skipped [1-9]' test-output.txt; then
            echo "::error::a test suite was skipped - the PostgreSQL-gated suites run against the postgres service and must not skip"
            exit 1
          fi

      - name: pnpm build
        run: pnpm build

  java:
    name: services (mvnw test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The wrapper (services/.mvn/wrapper/maven-wrapper.properties) pins the
      # same Maven version the READMEs document, so CI and local runs agree.
      - name: services/mvnw -f services/pom.xml test
        run: services/mvnw -B -ntp -f services/pom.xml test

  deployment:
    name: deployment (units + ansible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The quadlet generator is the parser that consumes the units on the
      # server: it errors on malformed files and missing required keys, and
      # every unit file must yield a .service. (Unknown keys are silently
      # dropped by podman, so key typos surface at server verification, not
      # here.) The jinja placeholders are rendered first, the same way the
      # ansible app role does; the generator runs in the podman image so CI
      # uses the podman 5.x generation the server requires.
      - name: units generate (quadlet)
        run: |
          docker run --rm -v "$PWD/infrastructure/units:/units:ro" quay.io/podman/stable:v5.8.9 sh -c '
            set -eu
            mkdir -p /out
            cp -r /units /tmp/units
            sed -i "s/{{ image_tag }}/ci/g" /tmp/units/*
            sed -i "s/{{ monitoring_bind }}/127.0.0.1/g" /tmp/units/*
            QUADLET_UNIT_DIRS=/tmp/units /usr/lib/systemd/system-generators/podman-system-generator /out /out /out
            expected=$(find /tmp/units -maxdepth 1 -type f \( -name '*.container' -o -name '*.network' -o -name '*.volume' \) | wc -l)
            generated=$(ls /out | grep -c "\.service$")
            echo "generated $generated of $expected unit files"
            test "$generated" -eq "$expected"
          '

      - name: ansible playbooks syntax
        run: |
          docker run --rm -v "$PWD/ansible:/ansible:ro" -w /ansible python:3.13-alpine sh -c '
            set -eu
            export ANSIBLE_ROLES_PATH=/ansible/roles
            export ANSIBLE_INVENTORY=/ansible/inventory.yml
            pip install -q ansible-core
            for p in playbooks/*.yml; do
              ansible-playbook --syntax-check "$p"
            done
          '
