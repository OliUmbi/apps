global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # liveness of the app containers, probed over the internal network
  - job_name: app-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://jublawoma:8001/
          - http://unclet:8002/
          - http://zelglihof:8003/
          - http://oliumbi:8004/
          - http://studio:8000/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: postgres-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["postgres:5432"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # TLS and certificate expiry, probed against Caddy on the app network. Each
  # target uses a per-site module that sends the public name as SNI and Host,
  # so the probe never depends on NAT hairpin (DR-18). instance stays the public
  # hostname, which the cert-expiry alert reports.
  - job_name: tls
    metrics_path: /probe
    static_configs:
      - targets: ["https://caddy:443/"]
        labels:
          public_host: jublawoma.ch
          probe_module: https_jublawoma
      - targets: ["https://caddy:443/"]
        labels:
          public_host: uncle-t.ch
          probe_module: https_unclet
      - targets: ["https://caddy:443/"]
        labels:
          public_host: zelglihof-maegenwil.ch
          probe_module: https_zelglihof
      - targets: ["https://caddy:443/"]
        labels:
          public_host: studio.oliumbi.ch
          probe_module: https_studio
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [probe_module]
        target_label: __param_module
      - source_labels: [public_host]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
      - regex: public_host|probe_module
        action: labeldrop
