# Alert rules: everything here maps to "do something now".
# Missing on purpose: log-based alerts (logs are for debugging, metrics are
# for alerting) and anything external (box-down detection needs a probe
# outside the box -- tracked in documentation/work/open-work.md).
groups:
  - name: availability
    rules:
      - alert: SiteProbeFailing
        expr: probe_success{job="app-http"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not answering"

      - alert: PostgresNotAnswering
        expr: probe_success{job="postgres-tcp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "postgres is not accepting connections"

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "node exporter is down (host or container problem)"

      # A missing series is not a healthy series: if blackbox or a scrape stops,
      # probe_success simply disappears and the == 0 rules cannot fire.
      - alert: ProbeSeriesMissing
        expr: absent(probe_success{job="app-http"}) or absent(probe_success{job="tls"}) or absent(probe_success{job="postgres-tcp"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "a blackbox probe series disappeared (blackbox or scrape failing)"

      - alert: ServiceDown
        expr: up{job="services"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not exposing metrics"

      - alert: TlsProbeFailing
        expr: probe_success{job="tls"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "TLS probe for {{ $labels.instance }} fails (proxy, certificate or routing)"

      # restart loops and stuck units show up as failed/activating services;
      # the systemd collector is the container-agnostic replacement for the
      # retired cAdvisor restart rule
      - alert: UnitFailing
        expr: node_systemd_unit_state{state="failed", name=~"apps-.*\\.service"} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} is in a failed state"

      - alert: UnitRestartLoop
        expr: changes(node_systemd_unit_start_time_seconds{name=~"apps-.*\\.service"}[1h]) > 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} restarted several times in the last hour"

  - name: capacity
    rules:
      - alert: DiskFillingUp
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "root filesystem is more than 85% full"

      - alert: BackupStale
        # absent() covers a fresh host (or a backup that never succeeded), where
        # there is no timestamp series to compare at all (RV-02).
        expr: absent(apps_backup_last_success_timestamp_seconds) or time() - apps_backup_last_success_timestamp_seconds > 36 * 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "no successful backup on record or none in the last 36 hours"

      - alert: HousekeepStale
        # Weekly timer: 8 days leaves room for one skipped run before alarming.
        expr: absent(apps_housekeep_last_success_timestamp_seconds) or time() - apps_housekeep_last_success_timestamp_seconds > 8 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "housekeeping has not reported a successful run for 8 days"

      # Caddy's duration histogram is the only request counter that carries the
      # status code. One HTTP server, so this is the portfolio-wide 5xx ratio.
      - alert: Edge5xxRate
        expr: >-
          sum(rate(caddy_http_request_duration_seconds_count{code=~"5.."}[5m]))
          /
          sum(rate(caddy_http_request_duration_seconds_count[5m])) > 0.01
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "more than 1% of edge responses are 5xx"

      - alert: Service5xxRate
        expr: >-
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum by (job) (rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} returns more than 1% 5xx"

      - alert: DbPoolSaturated
        expr: >-
          sum by (job) (hikaricp_connections_active)
          /
          sum by (job) (hikaricp_connections_max) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} database pool is above 90%"

      - alert: PostgresConnectionsHigh
        expr: >-
          sum(pg_stat_activity_count)
          /
          max(pg_settings_max_connections) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL is above 80% of max_connections"

      - alert: MessageFailed
        # Gauge delta: a terminal failure is new information even if the row
        # stays until housekeeping removes it a year later.
        expr: delta(messaging_messages{status="failed"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "a message reached FAILED in the last 15 minutes"

      - alert: QueueStalled
        expr: messaging_oldest_pending_age_seconds > 1800
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "the oldest pending message is more than 30 minutes old"

      # Caddy's ACME state is deliberately outside the backup (TD-16): a rebuilt
      # host re-issues. This alert makes sure re-issuance actually happens
      # before the current certificate expires.
      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="tls"} - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "certificate for {{ $labels.instance }} expires within 14 days"
