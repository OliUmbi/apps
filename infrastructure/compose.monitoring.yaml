# Monitoring stack. Started next to the app stack, shares the app network so
# prometheus can probe containers directly. Admin interfaces bind to
# MONITORING_BIND (the server's WireGuard address) -- there is no host
# firewall, so the bind address is what keeps these private.
#
#   docker compose --env-file .env -f compose.monitoring.yaml up -d
#
name: oliumbi-monitoring

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  prometheus:
    image: prom/prometheus:latest # TODO pin on first deploy
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${MONITORING_BIND:?set MONITORING_BIND}:9090:9090"
    networks: [monitoring, apps]
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest # TODO pin on first deploy
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${MONITORING_BIND:?set MONITORING_BIND}:9093:9093"
    networks: [monitoring]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:latest # TODO pin on first deploy
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile
      - --collector.textfile.directory=/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node-exporter-textfile:/textfile:ro
    ports:
      - "${MONITORING_BIND:?set MONITORING_BIND}:9100:9100"
    networks: [monitoring]
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest # TODO pin on first deploy
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${MONITORING_BIND:?set MONITORING_BIND}:8080:8080"
    networks: [monitoring]
    logging: *default-logging

  blackbox:
    image: prom/blackbox-exporter:latest # TODO pin on first deploy
    restart: unless-stopped
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox-config.yml:ro
    command:
      - --config.file=/etc/blackbox-config.yml
    networks: [monitoring, apps]
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest # TODO pin on first deploy
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${MONITORING_BIND:?set MONITORING_BIND}:3000:3000"
    networks: [monitoring]
    logging: *default-logging

networks:
  monitoring:
    driver: bridge
  apps:
    external: true
    name: oliumbi-apps_apps

volumes:
  prometheus-data:
  grafana-data:
