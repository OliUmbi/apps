server:
  port: 8082
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "mail.smtp.auth": ${SMTP_AUTH:false}
      "mail.smtp.starttls.enable": ${SMTP_TLS:false}
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 5000
      "mail.smtp.writetimeout": 5000
management:
  endpoints:
    web:
      exposure:
        include: health
messaging:
  internal-token: ${MESSAGING_INTERNAL_TOKEN}
  from-address: ${SMTP_FROM_ADDRESS}
  from-name: ${SMTP_FROM_NAME:Zelglihof}
