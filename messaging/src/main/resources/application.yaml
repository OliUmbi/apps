server:
  port: 8082
spring:
  datasource:
    url: jdbc:${DATABASE_URL}
    username: ${MESSAGING_DATABASE_USER}
    password: ${MESSAGING_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "mail.smtp.auth": ${SMTP_AUTH:false}
      "mail.smtp.starttls.enable": ${SMTP_TLS:false}
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 5000
      "mail.smtp.writetimeout": 5000
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  swagger-ui:
    path: /docs
messaging:
  authorization-token: ${MESSAGING_INTERNAL_AUTHORIZATION_TOKEN}
